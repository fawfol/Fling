<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta property="og:description" content="Play Fling Tower – a vertical platformer that tests your skill and timing. Try to climb the impossible tower!" />
  <meta property="og:image" content="https://www.tenzinkalsang.site/modular-index/Fling/assets/images/favicon.ico"/>
  <meta property="og:url" content="https://www.tenzinkalsang.site/modular-index/Fling" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <title>FLING : Can You Reach the Top?</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: center center;
        display: block;
    }
  </style>
</head>
<body>
  
  <script>
  const lang = (navigator.language || navigator.userLanguage).toLowerCase();
  const pageLang = lang.startsWith('ja') ? 'jp' : 'en';
  window.currentLanguage = pageLang;
  </script>

  
  <!-- phaser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>

  <!-- Game -->
  <script src="game.js"></script>
  
  <!-- zoom in on mobile game screen -->
  <script>
function scaleCanvas() {
  const canvas = document.querySelector("canvas");
  if (!canvas) return;

  const baseWidth = 500; 
  const baseHeight = 900;
  const scaleX = window.innerWidth / baseWidth;
  const scaleY = window.innerHeight / baseHeight;
  const scale = Math.min(scaleX, scaleY) * 0.85; // 85% zoom

  canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener("resize", scaleCanvas);
window.addEventListener("load", scaleCanvas);
</script>

</body>
</html>
